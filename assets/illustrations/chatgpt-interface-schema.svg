<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Schema der ChatGPT-Oberflaeche">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FAFAF9"/>
      <stop offset="1" stop-color="#F3F4F6"/>
    </linearGradient>
    <style>
      .frame { fill: white; stroke: #D1D5DB; stroke-width: 1.5; }
      .sidebar { fill: #F9FAFB; stroke: #E5E7EB; stroke-width: 1; }
      .chat-item { fill: #E5E7EB; }
      .chat-item-active { fill: #D1FAE5; stroke: #10B981; stroke-width: 1; }
      .input-area { fill: #FFFFFF; stroke: #D1D5DB; stroke-width: 1.5; rx: 12; }
      .button-circle { fill: #F3F4F6; stroke: #D1D5DB; stroke-width: 1; }
      .placeholder-text { fill: #9CA3AF; font-family: -apple-system, system-ui, sans-serif; font-size: 13px; }
      .label { fill: #4B5563; font-family: -apple-system, system-ui, sans-serif; font-size: 11px; }
      .accent { fill: #0F766E; }
      .traffic-red { fill: #FF5F56; }
      .traffic-yellow { fill: #FFBD2E; }
      .traffic-green { fill: #27C93F; }
    </style>
  </defs>

  <!-- Browser-Window-Hintergrund -->
  <rect class="frame" x="0" y="0" width="800" height="500" rx="14"/>

  <!-- Browser-Tab-Leiste -->
  <rect x="0" y="0" width="800" height="36" fill="#F3F4F6" rx="14"/>
  <rect x="0" y="22" width="800" height="14" fill="#F3F4F6"/>
  <circle class="traffic-red" cx="20" cy="18" r="6"/>
  <circle class="traffic-yellow" cx="40" cy="18" r="6"/>
  <circle class="traffic-green" cx="60" cy="18" r="6"/>
  <rect x="100" y="8" width="220" height="20" rx="6" fill="white" stroke="#D1D5DB" stroke-width="1"/>
  <text x="116" y="22" class="placeholder-text">chatgpt.com</text>

  <!-- Sidebar links -->
  <rect class="sidebar" x="0" y="36" width="200" height="464"/>
  <text x="20" y="62" class="label" font-weight="600" fill="#111827">ChatGPT</text>
  <rect x="20" y="78" width="160" height="32" rx="6" fill="#E5E7EB"/>
  <text x="32" y="98" class="label">+ Neuer Chat</text>
  <rect class="chat-item-active" x="20" y="124" width="160" height="28" rx="6"/>
  <text x="32" y="142" class="label" fill="#065F46">Bello-Gedicht</text>
  <rect class="chat-item" x="20" y="160" width="160" height="28" rx="6"/>
  <text x="32" y="178" class="label">Sommerfest-Brief</text>
  <rect class="chat-item" x="20" y="196" width="160" height="28" rx="6"/>
  <text x="32" y="214" class="label">Gruffelo-Aktivitaet</text>
  <rect class="chat-item" x="20" y="232" width="160" height="28" rx="6"/>
  <text x="32" y="250" class="label">Beobachtung Kind A</text>

  <!-- Modell-Toggle oben Mitte -->
  <rect x="240" y="56" width="180" height="30" rx="15" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1"/>
  <text x="258" y="76" class="label" font-weight="600">ChatGPT</text>
  <text x="320" y="76" class="label">Standard</text>
  <circle cx="395" cy="71" r="8" fill="white" stroke="#D1D5DB"/>
  <text x="392" y="75" class="label" font-size="10">▼</text>

  <!-- Profil oben rechts -->
  <circle cx="765" cy="68" r="16" fill="#0F766E"/>
  <text x="757" y="74" fill="white" font-family="system-ui" font-size="14" font-weight="600">CR</text>

  <!-- Hauptbereich: Antwort-Vorschau -->
  <rect x="240" y="110" width="540" height="280" rx="10" fill="#FAFAF9" stroke="#E5E7EB" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="260" y="140" class="placeholder-text" font-style="italic">Hier erscheinen die Antworten der KI.</text>

  <!-- Eingabefeld unten -->
  <rect class="input-area" x="240" y="410" width="540" height="60"/>
  <text x="280" y="446" class="placeholder-text">Frag mich was…</text>

  <!-- Buroklammer (Datei) links -->
  <circle class="button-circle" cx="262" cy="440" r="14"/>
  <text x="254" y="446" class="accent" font-size="16">📎</text>

  <!-- Mikrofon rechts (etwas links vom Senden) -->
  <circle class="button-circle" cx="725" cy="440" r="14"/>
  <text x="717" y="446" class="accent" font-size="16">🎙</text>

  <!-- Senden-Button rechts -->
  <circle cx="760" cy="440" r="14" fill="#0F766E"/>
  <text x="753" y="446" fill="white" font-size="16">↑</text>
</svg>
